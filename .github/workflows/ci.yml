name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  funcoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Cada função tem seu deno.json; roda em todas as pastas (menos _shared).
      - run: |
          for d in supabase/functions/*/; do
            [ "$(basename "$d")" = _shared ] && continue
            (cd "$d" && deno fmt --check . && deno check index.ts && deno test --permit-no-files) || exit 1
          done

  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Sobe só o necessário e aplica supabase/migrations + seed.sql num banco vazio.
      - run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase test db
      # Os tipos commitados precisam ser exatamente os do banco que as migrations criam.
      - run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts
